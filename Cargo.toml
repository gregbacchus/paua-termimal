[package]
name = "paua"
version = "0.2.1"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
libc = "0.2"
sha2 = "0.10"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
libghostty-vt = "0.2.2"
pangocairo = "0.22.9"
portable-pty = "0.9.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
unicode-width = "0.2.3"

[profile.release]
lto = "thin"
strip = true
